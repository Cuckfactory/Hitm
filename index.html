<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#11131a"/>
<title>HIT'M · The Cuck Factory</title>
<style>
:root{--cream:#f3d5a4;--gold:#f5c65b;--ink:#111219}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1017;color:var(--cream);font-family:"Courier New",monospace}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;background:#10131b}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#171923}
#tapHint{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;padding:7px 11px;border:1px solid rgba(242,213,165,.35);background:rgba(10,11,16,.62);font-weight:700;letter-spacing:.08em;font-size:12px;color:#f3ddbc;pointer-events:none;white-space:nowrap;backdrop-filter:blur(2px)}
@media(pointer:fine){#tapHint{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="tapHint">TAP = DROP / SWING</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
let W=1280,H=720,dpr=1,GROUND=610,mobile=false;
const state={phase:'ready',t:0,camX:0,hitQuality:0,hitLabel:'',distance:0,best:+localStorage.getItem('hitm_best_v2')||0,impactTimer:0,launch:null,marker:.5};
const G=1450;
const ansem={x:125,y:610,swing:0};
const tower={x:255,y:610,crateW:90,crateH:70,count:5};
const rasmr={x:300,y:200,vx:0,vy:0,w:42,h:54,rot:0,spin:0,bounces:0};
const particles=[];
const landmarks=[50,100,150,200,300,400,500,750,1000,1500];
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;mobile=W<700;GROUND=mobile?H-118:Math.min(H-76,610);ansem.y=GROUND;tower.y=GROUND;tower.x=mobile?W*.60:255;ansem.x=mobile?W*.14:125;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(state.phase==='ready'||state.phase==='result')resetRasmr();}
addEventListener('resize',resize);
function resetRasmr(){Object.assign(rasmr,{x:tower.x+tower.crateW/2,y:GROUND-tower.count*tower.crateH-28,vx:0,vy:0,rot:0,spin:0,bounces:0});}
function reset(){state.phase='ready';state.camX=0;state.hitQuality=0;state.hitLabel='';state.distance=0;state.impactTimer=0;state.launch=null;state.marker=.5;ansem.swing=0;particles.length=0;resetRasmr();}
function press(){if(state.phase==='ready'){state.phase='dropping';return}if(state.phase==='dropping'){swing();return}if(state.phase==='result'){reset();return}}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();press()}});c.addEventListener('pointerdown',e=>{e.preventDefault();press()},{passive:false});
function contactY(){return GROUND-128}
function qualityFromDy(dy){if(dy<=24)return 1-(dy/24)*.05;if(dy<=52)return .95-(dy-24)/28*.10;if(dy<=88)return .85-(dy-52)/36*.20;if(dy<=122)return .65-(dy-88)/34*.25;if(dy<=154)return .40-(dy-122)/32*.25;return 0}
function swing(){const dy=Math.abs(rasmr.y-contactY());const q=Math.max(0,qualityFromDy(dy));state.hitQuality=q;state.hitLabel=q>=.95?'PERFECT':q>=.83?'GREAT':q>=.62?'GOOD':q>=.36?'WEAK':'MISS';ansem.swing=1;
 if(q<.14){impactBurst(ansem.x+145,contactY(),.15);return}
 const speed=1180+3250*Math.pow(q,1.35);const loft=460+560*Math.pow(q,.9);state.launch={vx:speed,vy:-loft,spin:(4+7*q)*(Math.random()<.5?-1:1)};state.phase='impact';state.impactTimer=.082;impactBurst(ansem.x+148,contactY(),q);
}
function impactBurst(x,y,q){burst(x,y,'#fff0b0',18,220+q*220);burst(x,y,'#f3a642',10,160+q*150)}
function burst(x,y,color,n,power){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=35+Math.random()*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.35,color,size:2+Math.random()*4})}}
function update(dt){state.t+=dt;if(ansem.swing>0)ansem.swing=Math.max(0,ansem.swing-dt*3.6);
 if(state.phase==='dropping'){
   const zone=Math.abs(rasmr.y-contactY());const slow=zone<105?.62:1;rasmr.vy+=G*slow*dt;rasmr.y+=rasmr.vy*dt;state.marker=Math.max(.02,Math.min(.98,.5+(rasmr.y-contactY())/230*.5));
   if(rasmr.y>GROUND+35){state.phase='result';state.hitLabel='MISS';state.distance=0}
 }
 if(state.phase==='impact'){state.impactTimer-=dt;if(state.impactTimer<=0){rasmr.vx=state.launch.vx;rasmr.vy=state.launch.vy;rasmr.spin=state.launch.spin;state.phase='flying'}}
 if(state.phase==='flying'){
   rasmr.vy+=G*.75*dt;rasmr.x+=rasmr.vx*dt;rasmr.y+=rasmr.vy*dt;rasmr.rot+=rasmr.spin*dt;rasmr.vx*=Math.pow(.9984,dt*60);
   const target=Math.max(0,rasmr.x-W*.42);state.camX+=(target-state.camX)*Math.min(1,dt*5.2);
   if(rasmr.y>=GROUND-12){rasmr.y=GROUND-12;if(Math.abs(rasmr.vy)>250&&rasmr.bounces<2){rasmr.vy=-Math.abs(rasmr.vy)*(rasmr.bounces?0.20:0.31);rasmr.vx*=.84;rasmr.bounces++;burst(rasmr.x,GROUND-6,'#8a6245',9,110)}else{rasmr.vy=0;state.phase='sliding'}}
 }
 if(state.phase==='sliding'){
   rasmr.x+=rasmr.vx*dt;rasmr.rot+=rasmr.spin*dt;rasmr.vx*=Math.pow(.94,dt*60);rasmr.spin*=Math.pow(.925,dt*60);const target=Math.max(0,rasmr.x-W*.42);state.camX+=(target-state.camX)*Math.min(1,dt*5);
   if(Math.abs(rasmr.vx)<15){rasmr.vx=0;state.distance=Math.max(0,(rasmr.x-(ansem.x+145))/7.25);state.best=Math.max(state.best,state.distance);localStorage.setItem('hitm_best_v2',state.best.toFixed(1));state.phase='result'}
 }
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.vy+=470*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x-state.camX),Math.round(y),Math.round(w),Math.round(h))}
function srect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,size,col='#f2d5a5',align='left'){ctx.save();ctx.font=`bold ${Math.floor(size)}px Courier New`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle='#1b1217';ctx.fillText(t,x+2,y+2);ctx.fillStyle=col;ctx.fillText(t,x,y);ctx.restore()}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5a5d6d');g.addColorStop(.38,'#3a3f4b');g.addColorStop(1,'#181c24');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 drawClouds();drawSkyline();drawVictorianBlocks();drawFence();drawGround();drawProps();
}
function drawClouds(){ctx.fillStyle='rgba(42,46,56,.45)';for(let i=0;i<12;i++){const x=((i*173-state.camX*.08)%(W+260))-120,y=70+(i%4)*34;ctx.fillRect(x,y,95,18);ctx.fillRect(x+22,y-10,54,12)}}
function drawSkyline(){const p=state.camX*.12;ctx.fillStyle='#272b36';for(let i=-2;i<18;i++){const x=i*110-(p%110),h=70+(i*43)%130;ctx.fillRect(x,H*.35-h*.35,78,h*.35);ctx.fillRect(x+20,H*.35-h*.35-38,10,38)}}
function drawVictorianBlocks(){drawBuilding(-180-state.camX*.32,190,620,GROUND-190);drawBuilding(690-state.camX*.32,205,560,GROUND-205);drawBuilding(1410-state.camX*.32,165,570,GROUND-165)}
function drawBuilding(x,y,w,h){ctx.fillStyle='#211f27';ctx.fillRect(x,y,w,h);ctx.fillStyle='#3d2726';for(let yy=y;yy<y+h;yy+=24){for(let xx=x+((yy/24)%2)*13;xx<x+w;xx+=28)ctx.fillRect(xx,yy,24,18)}ctx.fillStyle='#151820';for(let k=0;k<5;k++)ctx.fillRect(x+42+k*100,y+76,42,94);ctx.fillStyle='#c18a45';for(let k=0;k<4;k++)if(k%2===0)ctx.fillRect(x+54+k*105,y+103,16,38);ctx.fillStyle='#26212a';for(let k=0;k<3;k++){ctx.fillRect(x+110+k*150,y-80,28,80);ctx.fillRect(x+116+k*150,y-102,16,22)}}
function drawFence(){const fy=GROUND-176;ctx.fillStyle='#12151c';ctx.fillRect(0,fy,W,9);for(let x=-(state.camX*.58%38);x<W;x+=38){ctx.fillRect(x,fy-36,5,212);ctx.beginPath();ctx.moveTo(x-3,fy-36);ctx.lineTo(x+2,fy-52);ctx.lineTo(x+7,fy-36);ctx.fill()}}
function drawGround(){ctx.fillStyle='#47372f';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#2f2825';for(let i=0;i<150;i++){const x=(i*91-state.camX*1.02)%(W+180)-90,y=GROUND+8+(i*29)%90;ctx.fillRect(x,y,17+(i%5)*6,4)}ctx.fillStyle='rgba(82,91,106,.30)';for(let i=0;i<7;i++)ctx.fillRect((i*310-state.camX*.86)%(W+360)-100,GROUND+58,160,10)}
function drawProps(){for(const m of landmarks){const x=ansem.x+145+m*7.25;if(x-state.camX>-100&&x-state.camX<W+100)drawSign(x,GROUND-42,`${m}m`)} if(!mobile){text('WORK\nHARDER',930-state.camX*.32,GROUND-190,18,'#776959');text('A BRIGHTER\nTOMORROW?',1190-state.camX*.32,GROUND-330,18,'#776959')} drawLamp(850-state.camX*.32,GROUND-155);drawLamp(1110-state.camX*.32,GROUND-250);}
function drawLamp(x,y){ctx.fillStyle='#191820';ctx.fillRect(x,y,7,155);ctx.fillStyle='#b57b3c';ctx.fillRect(x-10,y,27,37);ctx.fillStyle='#f4c55b';ctx.fillRect(x-5,y+6,17,24)}
function drawSign(x,y,label){rect(x,y,58,30,'#895d3c');rect(x+3,y+3,52,24,'#c38d56');text(label,x-state.camX+29,y+6,16,'#21171a','center')}
function drawCrates(){for(let i=0;i<tower.count;i++){const y=GROUND-(i+1)*tower.crateH;rect(tower.x,y,tower.crateW,tower.crateH,'#60381f');rect(tower.x+5,y+5,tower.crateW-10,tower.crateH-10,'#8c5834');ctx.strokeStyle='#4a2b1d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tower.x-state.camX+8,y+8);ctx.lineTo(tower.x-state.camX+tower.crateW-8,y+tower.crateH-8);ctx.moveTo(tower.x-state.camX+tower.crateW-8,y+8);ctx.lineTo(tower.x-state.camX+8,y+tower.crateH-8);ctx.stroke()}}
function drawRasmr(x,y,s=.75,rot=0,impactSquash=false){ctx.save();ctx.translate(Math.round(x-state.camX),Math.round(y));ctx.rotate(rot);if(impactSquash)ctx.scale(1.22,.78);ctx.scale(s,s);
 ctx.fillStyle='#272326';for(const [hx,hy] of [[-16,-39],[-8,-46],[2,-47],[12,-43],[-12,-32],[0,-34],[12,-32]]){ctx.beginPath();ctx.arc(hx,hy,7,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle='#bf7a45';ctx.fillRect(-14,-30,28,29);ctx.fillStyle='#d38f51';ctx.fillRect(9,-22,20,8);ctx.fillStyle='#c8c8c8';ctx.fillRect(-18,-25,15,7);ctx.fillRect(3,-25,15,7);ctx.fillStyle='#a61620';ctx.fillRect(-15,-23,11,4);ctx.fillRect(6,-23,11,4);
 ctx.fillStyle='#8a5d3a';ctx.fillRect(-17,1,34,27);ctx.fillStyle='#f0ece3';ctx.fillRect(-15,24,30,22);ctx.fillRect(-13,-1,5,31);ctx.fillRect(8,-1,5,31);ctx.fillStyle='#8a5d3a';ctx.fillRect(-22,6,6,18);ctx.fillRect(16,6,6,18);ctx.fillStyle='#d38f51';ctx.fillRect(-21,23,5,8);ctx.fillRect(17,23,5,8);ctx.fillStyle='#8a5d3a';ctx.fillRect(-11,46,8,12);ctx.fillRect(3,46,8,12);ctx.fillStyle='#5c3d2d';ctx.fillRect(-15,56,14,6);ctx.fillRect(1,56,14,6);ctx.restore()}
function drawQueue(){if(state.phase==='flying'||state.phase==='sliding'||state.phase==='result'||state.phase==='impact')drawRasmr(tower.x+tower.crateW/2,GROUND-tower.count*tower.crateH-28,.65,0)}
function drawAnsem(){const x=ansem.x-state.camX,y=GROUND;ctx.save();ctx.translate(Math.round(x),Math.round(y));
 ctx.fillStyle='#5b194f';ctx.fillRect(-2,-97,17,86);ctx.fillRect(20,-97,17,86);ctx.fillStyle='#d38a78';for(let yy=-92;yy<-20;yy+=18){ctx.fillRect(1,yy,4,15);ctx.fillRect(23,yy,4,15)}ctx.fillStyle='#25181b';ctx.fillRect(-10,-12,27,10);ctx.fillRect(16,-12,28,10);
 ctx.fillStyle='#4b173e';ctx.fillRect(-18,-185,67,99);ctx.fillStyle='#6b2455';ctx.fillRect(-24,-178,11,92);ctx.fillRect(44,-178,11,92);ctx.fillStyle='#b37754';ctx.fillRect(-1,-172,32,72);ctx.fillStyle='#f4e1ba';ctx.fillRect(4,-169,24,13);ctx.fillStyle='#a66f88';ctx.fillRect(4,-181,22,10);
 ctx.fillStyle='#1f181a';ctx.fillRect(-10,-226,48,35);ctx.fillStyle='#8f552f';ctx.fillRect(-4,-221,36,44);ctx.fillStyle='#f3e5c9';ctx.fillRect(2,-205,7,7);ctx.fillRect(20,-205,7,7);ctx.fillStyle='#21141a';ctx.fillRect(4,-203,3,3);ctx.fillRect(22,-203,3,3);ctx.fillStyle='#f7e4c0';for(let i=0;i<6;i++)ctx.fillRect(0+i*5,-188,4,10);ctx.fillStyle='#59174e';ctx.fillRect(-18,-258,64,38);ctx.fillStyle='#7c2c69';ctx.fillRect(-25,-225,78,12);
 // both hands and thick club/pimp cane
 const swingT=ansem.swing>0?1-ansem.swing:0;const a=ansem.swing>0?(-.2-1.25*swingT):-.22;ctx.save();ctx.translate(29,-118);ctx.rotate(a);ctx.fillStyle='#8f5b2c';ctx.fillRect(-5,-7,34,14);ctx.fillStyle='#c48b42';ctx.fillRect(14,-7,126,14);ctx.fillStyle='#d7a24d';ctx.beginPath();ctx.arc(142,0,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8f5b2c';ctx.fillRect(0,-10,13,20);ctx.restore();ctx.restore()}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);rect(p.x,p.y,p.size,p.size,p.color)}ctx.globalAlpha=1}
function drawDropGuide(){if(state.phase==='ready'||state.phase==='dropping'){const x=tower.x+tower.crateW+16-state.camX;ctx.fillStyle='#eee0c8';for(let y=GROUND-tower.count*tower.crateH+18;y<contactY()-10;y+=18)ctx.fillRect(x,y,6,9);ctx.beginPath();ctx.moveTo(x-7,contactY()-8);ctx.lineTo(x+3,contactY()+8);ctx.lineTo(x+13,contactY()-8);ctx.fill()}}
function drawUI(){const s=mobile?Math.max(.58,W/430):Math.min(1,W/1280);const titleSize=mobile?34:56*s;text("HIT'M",mobile?18:32,mobile?18:20,titleSize,'#ffd891');
 if(!mobile){boxLabel(36,95*s,132*s,38*s,'SPACE');text('= DROP',184*s,104*s,22*s);boxLabel(36,142*s,132*s,38*s,'SPACE');text('= SWING',184*s,151*s,22*s)}else{boxLabel(18,64,82,30,'TAP');text('DROP',108,69,17);boxLabel(18,99,82,30,'TAP');text('SWING',108,104,17)}
 const barW=mobile?Math.min(W*.48,200):Math.min(390*s,W*.32),bx=mobile?W*.49:(W-barW)/2,by=mobile?23:34*s;const label=state.hitLabel?state.hitLabel+' HIT!':'HIT PERFECT!';text(label,bx+barW/2,mobile?3:8*s,mobile?16:24*s,'#ffe4a2','center');srect(bx,by,barW,mobile?20:28*s,'#2a151b');srect(bx+4,by+4,barW-8,mobile?12:20*s,'#4c2430');srect(bx+barW*.42,by+4,barW*.16,mobile?12:20*s,'#efc24f');const marker=state.phase==='dropping'?state.marker:.5;srect(bx+marker*barW-2,by-4,4,mobile?28:38*s,'#fff3c2');if(!mobile){text('GOOD',bx,by+34*s,14*s,'#9b9298');text('PERFECT',bx+barW/2,by+34*s,14*s,'#f2c55b','center');text('GOOD',bx+barW,by+34*s,14*s,'#9b9298','right')}
 const dw=mobile?130:280*s,dh=mobile?70:98*s,dx=W-dw-(mobile?12:28),dy=mobile?64:24*s;srect(dx,dy,dw,dh,'#19151c');ctx.strokeStyle='#a36c49';ctx.lineWidth=3;ctx.strokeRect(dx,dy,dw,dh);text('DISTANCE',dx+dw/2,dy+(mobile?6:8*s),mobile?13:20*s,'#b8adb3','center');const live=(state.phase==='flying'||state.phase==='sliding')?Math.max(0,(rasmr.x-(ansem.x+145))/7.25):state.distance;text(String(Math.round(live)).padStart(3,'0')+' m',dx+dw/2,dy+(mobile?26:34*s),mobile?27:46*s,'#ffe0a0','center');text('BEST '+Math.round(state.best)+' m',W-(mobile?12:30),dy+dh+7,mobile?11:14*s,'#c5aa82','right');
 const prompt=state.phase==='ready'?(mobile?'TAP TO DROP':'SPACE / TAP TO DROP'):state.phase==='dropping'?(mobile?'TAP TO SWING':'SPACE / TAP TO SWING'):state.phase==='flying'?'FLY, LITTLE CUCK':state.phase==='sliding'?'KEEP SLIDING':state.phase==='impact'?'SMACK!':'TAP / SPACE TO RUN AGAIN';text(prompt,W/2,H-(mobile?62:34*s),mobile?13:18*s,'#f0d2a2','center');if(state.phase==='result'){const sub=state.hitLabel==='MISS'?'MISSED THE SHIFT':state.hitLabel+' CONTACT · '+Math.round(state.distance)+' m';text(sub,W/2,H-(mobile?84:62*s),mobile?13:19*s,state.hitLabel==='PERFECT'?'#f4cc55':'#d6b48d','center')}}
function boxLabel(x,y,w,h,label){srect(x,y,w,h,'#26151b');ctx.strokeStyle='#b67458';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);text(label,x+w/2,y+6,h*.55,'#ffe1aa','center')}
function draw(){ctx.clearRect(0,0,W,H);drawBackground();drawCrates();drawDropGuide();drawQueue();drawAnsem();if(state.phase==='ready'||state.phase==='dropping')drawRasmr(rasmr.x,rasmr.y,.72,0);else drawRasmr(rasmr.x,rasmr.y,.72,rasmr.rot,state.phase==='impact');drawParticles();drawUI()}
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
resize();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
